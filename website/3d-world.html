<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OUR SEARCH — 3D World</title>

  <link
    href="https://cesium.com/downloads/cesiumjs/releases/1.146/Build/Cesium/Widgets/widgets.css"
    rel="stylesheet"
  >
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.146/Build/Cesium/Cesium.js"></script>

  <style>
    * { box-sizing: border-box; }

    html, body, #world {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #07111d;
      font-family: system-ui, -apple-system, sans-serif;
    }

    #world { position: fixed; inset: 0; }

    .panel {
      position: fixed;
      z-index: 10;
      color: white;
      background: rgba(8, 18, 32, .88);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 16px;
      backdrop-filter: blur(14px);
      box-shadow: 0 10px 35px #0004;
    }

    #topbar {
      top: 14px;
      left: 14px;
      right: 14px;
      min-height: 58px;
      padding: 12px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      font-weight: 800;
      letter-spacing: 1.4px;
      font-size: 14px;
      white-space: nowrap;
    }

    .brand span { color: #62d9ff; }

    #city {
      width: min(48vw, 230px);
      padding: 10px;
      color: white;
      background: #17283a;
      border: 1px solid #40546a;
      border-radius: 10px;
      font-size: 13px;
    }

    #city option { background: #17283a; }

    #info {
      left: 14px;
      top: 88px;
      padding: 13px 15px;
      max-width: 260px;
      line-height: 1.45;
      font-size: 12px;
    }

    #info strong {
      display: block;
      font-size: 15px;
      margin-bottom: 4px;
    }

    #notice {
      position: fixed;
      z-index: 20;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(88vw, 390px);
      padding: 20px;
      border-radius: 16px;
      color: white;
      background: #101f31;
      border: 1px solid #426078;
      text-align: center;
      line-height: 1.5;
    }

    #notice button {
      margin-top: 12px;
      padding: 10px 16px;
      color: #06131e;
      background: #62d9ff;
      border: 0;
      border-radius: 9px;
      font-weight: 700;
    }

    #notice.hidden { display: none; }

    #controls {
      position: fixed;
      z-index: 10;
      left: 16px;
      bottom: 20px;
      display: grid;
      grid-template-columns: repeat(3, 53px);
      grid-template-rows: repeat(2, 53px);
      gap: 7px;
    }

    .move {
      border: 1px solid #ffffff35;
      border-radius: 14px;
      color: white;
      background: rgba(8,18,32,.85);
      font-size: 20px;
      font-weight: 700;
      touch-action: none;
      user-select: none;
    }

    .move:active {
      background: #1a789b;
      transform: scale(.96);
    }

    #forward { grid-column: 2; grid-row: 1; }
    #left { grid-column: 1; grid-row: 2; }
    #back { grid-column: 2; grid-row: 2; }
    #right { grid-column: 3; grid-row: 2; }

    #help {
      right: 14px;
      bottom: 20px;
      max-width: 190px;
      padding: 12px 14px;
      font-size: 11px;
      line-height: 1.7;
    }

    #help strong {
      display: block;
      font-size: 12px;
      margin-bottom: 3px;
    }

    .cesium-viewer-bottom {
      bottom: 2px !important;
    }

    @media (max-width: 520px) {
      #topbar { top: 8px; left: 8px; right: 8px; }
      #info { top: 78px; left: 8px; max-width: 205px; }
      #controls { left: 10px; bottom: 20px; }
      #help { right: 8px; bottom: 20px; max-width: 150px; }
      .move { width: 48px; height: 48px; }
      #controls {
        grid-template-columns: repeat(3, 48px);
        grid-template-rows: repeat(2, 48px);
      }
    }
  </style>
</head>

<body>
  <div id="world"></div>

  <header id="topbar" class="panel">
    <div class="brand">OUR <span>SEARCH</span> / WORLD</div>
    <select id="city" aria-label="Choose a city">
      <option value="sf">San Francisco</option>
      <option value="ny">New York</option>
      <option value="la">Los Angeles</option>
      <option value="kolkata">Kolkata</option>
    </select>
  </header>

  <section id="info" class="panel">
    <strong>3D World Explorer</strong>
    <div id="location">Preparing your world…</div>
    <div id="worldStatus">Loading Earth…</div>
  </section>

  <div id="controls" aria-label="Character movement">
    <button class="move" id="forward" aria-label="Move forward">▲</button>
    <button class="move" id="left" aria-label="Turn left">◀</button>
    <button class="move" id="back" aria-label="Move backward">▼</button>
    <button class="move" id="right" aria-label="Turn right">▶</button>
  </div>

  <section id="help" class="panel">
    <strong>Explore controls</strong>
    W / S — Move forward / back<br>
    A / D — Turn left / right<br>
    Phone — Use arrow buttons<br>
    Camera — Follows your character
  </section>

  <div id="notice">
    <strong>Preparing OUR SEARCH World</strong>
    <div id="noticeText">Loading the globe and world data. This may take a moment.</div>
    <button id="noticeButton" class="hidden">Continue</button>
  </div>

  <script>
    // Optional for the basic globe. A valid Cesium ion token enables
    // Cesium World Terrain and real 3D OpenStreetMap building tiles.
    const CESIUM_ION_TOKEN = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJub25jZSI6IlR4dGRlZzNYZDRFaDRxaXYiLCJqdGkiOiI3OWVkYjBhYS0yNDUxLTQzY2YtOGUyYi1iZGVkYzRkMzM0NjgiLCJpZCI6NTI5MDQ1LCJzdWIiOiJTYW1pcCBHdXB0YSIsImlzcyI6Imh0dHBzOi8vYXBpLmNlc2l1bS5jb20iLCJhdWQiOiJTYW1pcCBHdXB0YSIsImlhdCI6MTc5MjMwNzA4Mn0.hgTDeTY91uDGI3VP7IE66v8_3VFc-oVkGT9eqhL2vVw";

    // City coordinates: latitude, longitude.
    const cities = {
      sf:      { name: "San Francisco", lat: 37.7749, lon: -122.4194 },
      ny:      { name: "New York",      lat: 40.7128, lon:  -74.0060 },
      la:      { name: "Los Angeles",   lat: 34.0522, lon: -118.2437 },
      kolkata: { name: "Kolkata",       lat: 22.5726, lon:   88.3639 }
    };

    const notice = document.getElementById("notice");
    const noticeText = document.getElementById("noticeText");
    const noticeButton = document.getElementById("noticeButton");
    const locationText = document.getElementById("location");
    const worldStatus = document.getElementById("worldStatus");

    let viewer;
    let buildingsLoaded = false;
    let activeCity = cities.sf;
    let player = { lat: activeCity.lat, lon: activeCity.lon, heading: 0 };
    let lastFrame = performance.now();
    const keys = new Set();
    const parts = [];

    const radians = Cesium.Math.toRadians;

    function closeNotice() {
      notice.classList.add("hidden");
    }

    noticeButton.addEventListener("click", closeNotice);

    function showMessage(message) {
      noticeText.textContent = message;
      noticeButton.classList.remove("hidden");
      notice.classList.remove("hidden");
    }

    function positionAt(lat, lon, height = 0) {
      return Cesium.Cartesian3.fromDegrees(lon, lat, height);
    }

    // Convert local character offsets (east, north, up) to Earth coordinates.
    function localPosition(center, east, north, up) {
      const frame = Cesium.Transforms.eastNorthUpToFixedFrame(center);
      const offset = new Cesium.Cartesian3(east, north, up);
      return Cesium.Matrix4.multiplyByPointAsVector(
        frame,
        offset,
        new Cesium.Cartesian3()
      );
    }

    function createCharacter() {
      // A simple 3D mannequin made from ellipsoids.
      // Later we can replace these pieces with your own 3D character model.
      const shapeList = [
        { name: "body", east: 0, north: 0, up: 1.12,
          radii: new Cesium.Cartesian3(.27, .19, .43),
          color: Cesium.Color.fromCssColorString("#25c8ff") },

        { name: "head", east: 0, north: 0, up: 1.78,
          radii: new Cesium.Cartesian3(.19, .19, .20),
          color: Cesium.Color.fromCssColorString("#f2c49b") },

        { name: "left arm", east: -.34, north: 0, up: 1.20,
          radii: new Cesium.Cartesian3(.105, .12, .34),
          color: Cesium.Color.fromCssColorString("#148db9") },

        { name: "right arm", east: .34, north: 0, up: 1.20,
          radii: new Cesium.Cartesian3(.105, .12, .34),
          color: Cesium.Color.fromCssColorString("#148db9") },

        { name: "left leg", east: -.13, north: 0, up: .48,
          radii: new Cesium.Cartesian3(.12, .13, .34),
          color: Cesium.Color.fromCssColorString("#263b68") },

        { name: "right leg", east: .13, north: 0, up: .48,
          radii: new Cesium.Cartesian3(.12, .13, .34),
          color: Cesium.Color.fromCssColorString("#263b68") }
      ];

      for (const shape of shapeList) {
        const entity = viewer.entities.add({
          name: shape.name,
          position: positionAt(player.lat, player.lon, 0),
          ellipsoid: {
            radii: shape.radii,
            material: shape.color,
            outline: true,
            outlineColor: Cesium.Color.WHITE.withAlpha(.25)
          }
        });

        parts.push({ entity, shape });
      }
    }

    function updateCharacter() {
      const center = positionAt(player.lat, player.lon, 0);

      for (const item of parts) {
        const s = item.shape;
        item.entity.position = localPosition(center, s.east, s.north, s.up);
      }

      locationText.textContent =
        activeCity.name + " · " +
        player.lat.toFixed(5) + ", " + player.lon.toFixed(5);
    }

    function followCharacter() {
      const target = positionAt(player.lat, player.lon, 1.0);

      // Place the camera behind the character and look down slightly.
      viewer.camera.lookAt(
        target,
        new Cesium.HeadingPitchRange(
          player.heading + Math.PI,
          radians(-18),
          18
        )
      );
    }

    function moveCharacter(delta) {
      const turnSpeed = 1.7;
      const walkSpeed = 0.000035; // Approximate latitude degrees per second.

      if (keys.has("a") || keys.has("arrowleft")) {
        player.heading -= turnSpeed * delta;
      }
      if (keys.has("d") || keys.has("arrowright")) {
        player.heading += turnSpeed * delta;
      }

      let direction = 0;
      if (keys.has("w") || keys.has("arrowup")) direction += 1;
      if (keys.has("s") || keys.has("arrowdown")) direction -= 1;

      if (direction !== 0) {
        const distance = walkSpeed * delta * direction;
        player.lat += Math.cos(player.heading) * distance;
        const cosLat = Math.max(.15, Math.cos(radians(player.lat)));
        player.lon += Math.sin(player.heading) * distance / cosLat;

        // Keep longitude inside the usual range.
        if (player.lon > 180) player.lon -= 360;
        if (player.lon < -180) player.lon += 360;
      }

      updateCharacter();
      followCharacter();
    }

    async function loadWorld() {
      const hasToken =
        CESIUM_ION_TOKEN !== "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJub25jZSI6IlR4dGRlZzNYZDRFaDRxaXYiLCJqdGkiOiI3OWVkYjBhYS0yNDUxLTQzY2YtOGUyYi1iZGVkYzRkMzM0NjgiLCJpZCI6NTI5MDQ1LCJzdWIiOiJTYW1pcCBHdXB0YSIsImlzcyI6Imh0dHBzOi8vYXBpLmNlc2l1bS5jb20iLCJhdWQiOiJTYW1pcCBHdXB0YSIsImlhdCI6MTc5MjMwNzA4Mn0.hgTDeTY91uDGI3VP7IE66v8_3VFc-oVkGT9eqhL2vVw" &&
        CESIUM_ION_TOKEN.trim().length > 10;

      if (hasToken) {
        Cesium.Ion.defaultAccessToken = CESIUM_ION_TOKEN;
      }

      viewer = new Cesium.Viewer("world", {
        animation: false,
        timeline: false,
        baseLayerPicker: false,
        geocoder: false,
        homeButton: false,
        sceneModePicker: false,
        navigationHelpButton: false,
        fullscreenButton: false,
        infoBox: false,
        selectionIndicator: false,
        scene3DOnly: true,
        terrain: hasToken
          ? Cesium.Terrain.fromWorldTerrain()
          : new Cesium.EllipsoidTerrainProvider()
      });

      viewer.scene.globe.depthTestAgainstTerrain = false;
      viewer.scene.screenSpaceCameraController.enableTilt = false;
      viewer.scene.screenSpaceCameraController.enableRotate = false;

      if (hasToken) {
        try {
          const buildings = await Cesium.createOsmBuildingsAsync();
          viewer.scene.primitives.add(buildings);
          buildingsLoaded = true;
          worldStatus.textContent = "Real 3D buildings enabled";
        } catch (error) {
          console.error("Buildings could not load:", error);
          worldStatus.textContent = "Globe loaded; 3D buildings unavailable";
        }
      } else {
        worldStatus.textContent = "Basic globe · Add a Cesium token for 3D data";
      }

      createCharacter();
      updateCharacter();
      followCharacter();

      viewer.scene.camera.moveEnd.addEventListener(() => {
        // The follow camera is controlled by the game loop.
      });

      notice.classList.add("hidden");
      if (!hasToken) {
        showMessage(
          "The basic globe is ready. To enable real 3D terrain and buildings, " +
          "create a Cesium ion access token, add it to this page, and reload."
        );
      }

      requestAnimationFrame(gameLoop);
    }

    function gameLoop(now) {
      const delta = Math.min((now - lastFrame) / 1000, .05);
      lastFrame = now;

      if (viewer && !viewer.isDestroyed()) {
        moveCharacter(delta);
        viewer.scene.requestRender();
      }

      requestAnimationFrame(gameLoop);
    }

    document.getElementById("city").addEventListener("change", event => {
      activeCity = cities[event.target.value];
      player.lat = activeCity.lat;
      player.lon = activeCity.lon;
      player.heading = 0;

      if (viewer) {
        updateCharacter();
        followCharacter();
        viewer.scene.requestRender();
      }
    });

    // Keyboard controls.
    window.addEventListener("keydown", event => {
      const key = event.key.toLowerCase();
      if (["w", "a", "s", "d", "arrowup", "arrowdown",
           "arrowleft", "arrowright"].includes(key)) {
        event.preventDefault();
        keys.add(key);
      }
    });

    window.addEventListener("keyup", event => {
      keys.delete(event.key.toLowerCase());
    });

    window.addEventListener("blur", () => keys.clear());

    // Touch and mouse controls for the on-screen buttons.
    function bindButton(id, key) {
      const button = document.getElementById(id);

      button.addEventListener("pointerdown", event => {
        event.preventDefault();
        keys.add(key);
        button.setPointerCapture?.(event.pointerId);
      });

      const release = event => {
        event.preventDefault();
        keys.delete(key);
      };

      button.addEventListener("pointerup", release);
      button.addEventListener("pointercancel", release);
      button.addEventListener("lostpointercapture", () => keys.delete(key));
    }

    bindButton("forward", "w");
    bindButton("back", "s");
    bindButton("left", "a");
    bindButton("right", "d");

    loadWorld().catch(error => {
      console.error("OUR SEARCH World failed:", error);
      showMessage(
        "The 3D world could not finish loading. Check your internet connection " +
        "and the browser console, then reload the page."
      );
    });
  </script>
</body>
</html>
