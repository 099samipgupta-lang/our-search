<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>OUR SEARCH — San Francisco World</title>

<style>
*{box-sizing:border-box}
html,body,#game{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#111c2b;color:#fff;font-family:system-ui,Arial,sans-serif}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
.panel{position:fixed;z-index:5;background:#0a1424d9;
 border:1px solid #ffffff25;backdrop-filter:blur(12px);border-radius:14px}
#top{top:12px;left:12px;right:12px;padding:13px 15px;
 display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-size:13px;font-weight:850;letter-spacing:1.5px}
.logo span{color:#65dcff}
#status{font-size:11px;color:#b6d6e8;text-align:right}
#intro{position:fixed;z-index:4;left:50%;top:48%;transform:translate(-50%,-50%);
 text-align:center;pointer-events:none;text-shadow:0 3px 18px #000}
#intro h1{font-size:clamp(25px,6vw,48px);margin:0;letter-spacing:2px}
#intro p{font-size:13px;color:#d1e5ef}
#controls{position:fixed;z-index:6;left:14px;bottom:22px;
 display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:7px}
.move{color:white;background:#101f33d9;border:1px solid #ffffff45;
 border-radius:14px;font-size:21px;font-weight:800;touch-action:none}
.move:active{background:#176f91}
#forward{grid-column:2;grid-row:1}
#left{grid-column:1;grid-row:2}
#back{grid-column:2;grid-row:2}
#right{grid-column:3;grid-row:2}
#help{position:fixed;right:12px;bottom:23px;padding:12px 14px;
 font-size:11px;line-height:1.7;color:#dcebf4}
#help b{display:block;color:white;font-size:12px}
#error{display:none;position:fixed;z-index:20;top:40%;left:8%;right:8%;
 padding:20px;text-align:center;background:#101f33;border-radius:14px}
@media(max-width:500px){
 #top{top:8px;left:8px;right:8px;padding:11px}
 #controls{left:9px;bottom:17px;grid-template-columns:repeat(3,46px);
 grid-template-rows:repeat(2,46px)}
 .move{font-size:18px}
 #help{right:8px;bottom:17px;font-size:10px;padding:9px}
 #intro{top:40%}
}
</style>
</head>
<body>
<div id="game"></div>

<header id="top" class="panel">
  <div class="logo">OUR <span>SEARCH</span> / WORLD</div>
  <div id="status">SAN FRANCISCO · LOADING CITY</div>
</header>

<div id="intro">
  <h1>SAN FRANCISCO</h1>
  <p>A city to explore.</p>
</div>

<div id="controls">
  <button class="move" id="forward" aria-label="Walk forward">▲</button>
  <button class="move" id="left" aria-label="Turn left">◀</button>
  <button class="move" id="back" aria-label="Walk backward">▼</button>
  <button class="move" id="right" aria-label="Turn right">▶</button>
</div>

<div id="help" class="panel">
  <b>EXPLORE</b>
  W / S — Walk<br>
  A / D — Turn<br>
  Use buttons on phone
</div>

<div id="error">The 3D scene could not load. Check your internet connection and reload.</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { AssetLoader } from "./game/asset-loader.js";

const root = document.getElementById("game");
const status = document.getElementById("status");
const intro = document.getElementById("intro");
const errorBox = document.getElementById("error");

try {
  // SCENE: start on a city street, never in space.
  const scene = new THREE.Scene();
  const assetLoader = new AssetLoader();
  const activeAssets = new Set();
  scene.background = new THREE.Color(0xb9cbd5);
  scene.fog = new THREE.FogExp2(0xb9cbd5, 0.00135);

  const camera = new THREE.PerspectiveCamera(
    65, innerWidth / innerHeight, 0.1, 1200
  );

  const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: "high-performance"
  });

  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.25));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.18;
  root.appendChild(renderer.domElement);

  // CINEMATIC LIGHTING
  scene.add(new THREE.HemisphereLight(0xd9eaff, 0x655044, 1.7));

  const sun = new THREE.DirectionalLight(0xffd09a, 3.0);
  sun.position.set(-90, 150, 70);
  sun.castShadow = true;
  sun.shadow.mapSize.set(512, 512);
  sun.shadow.camera.left = -100;
  sun.shadow.camera.right = 100;
  sun.shadow.camera.top = 100;
  sun.shadow.camera.bottom = -100;
  sun.shadow.camera.near = 1;
  sun.shadow.camera.far = 320;
  sun.shadow.normalBias = 0.035;
  sun.shadow.bias = -0.0003;
  scene.add(sun);

  const fill = new THREE.DirectionalLight(0x91bfe8, 0.7);
  fill.position.set(100, 55, -100);
  scene.add(fill);

  function mat(color, roughness=0.8, metalness=0) {
    return new THREE.MeshStandardMaterial({
      color, roughness, metalness
    });
  }

  const asphalt = mat(0x303944);
  const sidewalk = mat(0x858b8d);
  const concrete = mat(0xb7b6ad);
  const whiteLine = mat(0xe2d9bb);
  const red = mat(0xb83f36, 0.6);
  const windowMats = [
    mat(0x273d50, 0.3, 0.25),
    mat(0x527185, 0.3, 0.3),
    mat(0xf6c779, 0.35, 0.1),
    mat(0x1c293b, 0.25, 0.4)
  ];

  function box(w,h,d,material,x,y,z,cast=true) {
    const mesh = new THREE.Mesh(
      new THREE.BoxGeometry(w,h,d), material
    );
    mesh.position.set(x,y,z);
    mesh.castShadow = cast;
    mesh.receiveShadow = true;
    scene.add(mesh);
    return mesh;
  }

  function cylinder(rt,rb,h,material,x,y,z,segments=10) {
    const mesh = new THREE.Mesh(
      new THREE.CylinderGeometry(rt,rb,h,segments), material
    );
    mesh.position.set(x,y,z);
    mesh.castShadow = true;
    scene.add(mesh);
    return mesh;
  }

  // CONTINUOUS SAN FRANCISCO TERRAIN
  // Shared elevation function for terrain, roads and building placement.
  function hill(x, z) {
    return (
      Math.sin(x * 0.012) * 5.5 +
      Math.sin(z * 0.017) * 4.5 +
      Math.sin((x + z) * 0.009) * 2.5 +
      Math.sin((x - z) * 0.006) * 1.8
    );
  }

  // Subdivided terrain with real elevation.
  const terrainSize = 1000;
  const terrainSegments = 160;
  const terrainPositions = [];
  const terrainIndices = [];

  for (let iz = 0; iz <= terrainSegments; iz++) {
    const z = -terrainSize / 2 + terrainSize * iz / terrainSegments;

    for (let ix = 0; ix <= terrainSegments; ix++) {
      const x = -terrainSize / 2 + terrainSize * ix / terrainSegments;
      terrainPositions.push(x, hill(x, z) - 0.28, z);
    }
  }

  for (let iz = 0; iz < terrainSegments; iz++) {
    for (let ix = 0; ix < terrainSegments; ix++) {
      const a = iz * (terrainSegments + 1) + ix;
      const b = a + 1;
      const c = a + terrainSegments + 1;
      const d = c + 1;
      terrainIndices.push(a, c, b, b, c, d);
    }
  }

  const terrainGeometry = new THREE.BufferGeometry();
  terrainGeometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(terrainPositions, 3)
  );
  terrainGeometry.setIndex(terrainIndices);
  terrainGeometry.computeVertexNormals();

  const terrain = new THREE.Mesh(
    terrainGeometry,
    mat(0x777b73, 0.96)
  );
  terrain.receiveShadow = true;
  scene.add(terrain);

  // Roads, lane markings and sidewalks follow the terrain elevation.
  function makeRibbon(width, length, axis, center, material, yOffset) {
    const segments = Math.ceil(length / 4);
    const positions = [];
    const indices = [];

    for (let i = 0; i <= segments; i++) {
      const along = -length / 2 + length * i / segments;

      for (const side of [-1, 1]) {
        let x, z;

        if (axis === "z") {
          x = center + side * width / 2;
          z = along;
        } else {
          x = along;
          z = center + side * width / 2;
        }

        positions.push(x, hill(x, z) + yOffset, z);
      }
    }

    for (let i = 0; i < segments; i++) {
      const a = i * 2;
      const b = a + 1;
      const c = a + 2;
      const d = a + 3;

      if (axis === "z") {
        indices.push(a, c, b, b, c, d);
      } else {
        indices.push(a, b, c, b, d, c);
      }
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute(
      "position",
      new THREE.Float32BufferAttribute(positions, 3)
    );
    geometry.setIndex(indices);
    geometry.computeVertexNormals();

    const mesh = new THREE.Mesh(geometry, material);
    mesh.receiveShadow = true;
    scene.add(mesh);
    return mesh;
  }

  const roadWidth = 12;
  const blockStep = 38;
  const roadLength = 900;

  for (let i = -12; i <= 12; i++) {
    const p = i * blockStep;

    makeRibbon(roadWidth, roadLength, "z", p, asphalt, 0.055);
    makeRibbon(roadWidth, roadLength, "x", p, asphalt, 0.055);

    for (const offset of [-1.2, 1.2]) {
      makeRibbon(0.12, roadLength, "z", p + offset, whiteLine, 0.105);
      makeRibbon(0.12, roadLength, "x", p + offset, whiteLine, 0.105);
    }

    for (const side of [-1, 1]) {
      makeRibbon(2, roadLength, "z", p + side * 7.2, sidewalk, 0.13);
      makeRibbon(2, roadLength, "x", p + side * 7.2, sidewalk, 0.13);
    }
  }

  // CITY BUILDINGS: deterministic layout, not random every reload.
  let seed = 7319;
  function rand() {
    seed = (seed * 16807) % 2147483647;
    return (seed-1)/2147483646;
  }

  const facadeColors = [
    0xb6a38e, 0x8e9eaa, 0xc5b7a0, 0x777f8b,
    0xd2c8b7, 0x7c8e98, 0x9d8979, 0x596b7b
  ];

  // Shared materials keep the city rendering more efficiently.
    // Subtle, fine-grained stucco surface for California-style facades.
  // Shared textures keep GPU memory and draw calls under control.
  // Procedural stucco texture retained as a fallback.
  const facadeSurfaceTexture = (() => {
    const canvas = document.createElement("canvas");
    canvas.width = 256;
    canvas.height = 256;
    const ctx = canvas.getContext("2d");
    const pixels = ctx.createImageData(256, 256);

    for (let i = 0; i < pixels.data.length; i += 4) {
      const shade = 229 + Math.floor(Math.random() * 27);
      pixels.data[i] = shade;
      pixels.data[i + 1] = shade;
      pixels.data[i + 2] = shade;
      pixels.data[i + 3] = 255;
    }
    ctx.putImageData(pixels, 0, 0);

    for (let i = 0; i < 220; i++) {
      const shade = Math.random() < 0.5 ? 125 : 255;
      ctx.fillStyle = `rgba(${shade},${shade},${shade},0.045)`;
      ctx.beginPath();
      ctx.ellipse(
        Math.random() * 256, Math.random() * 256,
        2 + Math.random() * 10, 1 + Math.random() * 5,
        Math.random() * Math.PI, 0, Math.PI * 2
      );
      ctx.fill();
    }

    const map = new THREE.CanvasTexture(canvas);
    map.colorSpace = THREE.SRGBColorSpace;
    map.wrapS = map.wrapT = THREE.RepeatWrapping;
    map.repeat.set(2, 3);
    map.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy());

    const bumpMap = new THREE.CanvasTexture(canvas);
    bumpMap.wrapS = bumpMap.wrapT = THREE.RepeatWrapping;
    bumpMap.repeat.copy(map.repeat);
    bumpMap.anisotropy = map.anisotropy;

    return { map, bumpMap };
  })();

  const facadeMaterials = new Map(
    facadeColors.map(color => [
      color,
      new THREE.MeshStandardMaterial({
        color,
        map: facadeSurfaceTexture.map,
        bumpMap: facadeSurfaceTexture.bumpMap,
        bumpScale: 0.012,
        roughness: 0.92,
        metalness: 0.0
      })
    ])
  );

  // Shared Poly Haven White Stucco 02 PBR maps.
  const facadeLoader = new THREE.TextureLoader();
  const facadeMaterialList = [...facadeMaterials.values()];

  function configureFacadeMap(texture, isColorMap = false) {
    if (isColorMap) {
      texture.colorSpace = THREE.SRGBColorSpace;
    }
    texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
    texture.repeat.set(2, 3);
    texture.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy());
    return texture;
  }

  facadeLoader.load(
    "./assets/city_materials/stucco_diffuse_1k.jpg",
    texture => {
      configureFacadeMap(texture, true);
      for (const material of facadeMaterialList) {
        material.map = texture;
        material.needsUpdate = true;
      }
      console.info("City stucco color map loaded.");
    },
    undefined,
    error => console.warn("Stucco color map failed; procedural fallback remains active.", error)
  );

  facadeLoader.load(
    "./assets/city_materials/stucco_normal_1k.png",
    texture => {
      configureFacadeMap(texture);
      for (const material of facadeMaterialList) {
        material.normalMap = texture;
        material.normalScale.set(0.35, 0.35);
        material.bumpMap = null;
        material.needsUpdate = true;
      }
      console.info("City stucco normal map loaded.");
    },
    undefined,
    error => console.warn("Stucco normal map failed; fallback surface remains active.", error)
  );

  facadeLoader.load(
    "./assets/city_materials/stucco_roughness_1k.jpg",
    texture => {
      configureFacadeMap(texture);
      for (const material of facadeMaterialList) {
        material.roughnessMap = texture;
        material.roughness = 0.92;
        material.needsUpdate = true;
      }
      console.info("City stucco roughness map loaded.");
    },
    undefined,
    error => console.warn("Stucco roughness map failed; default roughness remains active.", error)
  );

  const roofMaterial = mat(0x343e49, 0.88);
  const rooftopMaterial = mat(0x505962, 0.82);


  // CALIFORNIA CITY ARCHITECTURE UPGRADE
  // Preserve terrain, road network, player, traffic and landmarks.
  // Repeated facade details are instanced to reduce draw calls.

  const cityWindowInstances = windowMats.map(() => []);
  const cityWindowDummy = new THREE.Object3D();
  const cityWindowGeometry = new THREE.BoxGeometry(1, 1, 1);

  const cityTrimLight = mat(0xe6dccb, 0.78, 0.02);
  const cityTrimDark = mat(0x514a43, 0.84, 0.01);
  const cityConcrete = mat(0x9c988f, 0.88, 0.01);
  const cityTerracotta = mat(0xa75f45, 0.80, 0.01);
  const cityMetal = mat(0x343b40, 0.48, 0.42);
  const cityAwning = mat(0x9c4937, 0.72, 0.02);

  const cityStoreGlass = new THREE.MeshStandardMaterial({
    color: 0x314a57, roughness: 0.24, metalness: 0.24
  });
  const cityBalconyGlass = new THREE.MeshStandardMaterial({
    color: 0x9eb9bf, roughness: 0.28, metalness: 0.10,
    transparent: true, opacity: 0.72, depthWrite: false
  });

  // Shared detail-material batches:
  // 0 light trim, 1 dark trim, 2 concrete, 3 terracotta,
  // 4 metal, 5 awnings/sign fascia, 6 shop glazing, 7 balcony glazing.
  const cityDetailMaterials = [
    cityTrimLight, cityTrimDark, cityConcrete, cityTerracotta,
    cityMetal, cityAwning, cityStoreGlass, cityBalconyGlass
  ];
  const cityDetailInstances = cityDetailMaterials.map(() => []);
  const cityDetailGeometry = new THREE.BoxGeometry(1, 1, 1);
  const cityDetailDummy = new THREE.Object3D();

  function addCityDetail(x, y, z, sx, sy, sz, materialIndex) {
    if (
      ![x, y, z, sx, sy, sz].every(Number.isFinite) ||
      sx <= 0 || sy <= 0 || sz <= 0
    ) return;

    cityDetailDummy.position.set(x, y, z);
    cityDetailDummy.rotation.set(0, 0, 0);
    cityDetailDummy.scale.set(sx, sy, sz);
    cityDetailDummy.updateMatrix();
    cityDetailInstances[materialIndex].push(cityDetailDummy.matrix.clone());
  }

  function addCityWindow(x, y, z, width, height, depth, materialIndex) {
    cityWindowDummy.position.set(x, y, z);
    cityWindowDummy.rotation.set(0, 0, 0);
    cityWindowDummy.scale.set(width, height, depth);
    cityWindowDummy.updateMatrix();
    cityWindowInstances[materialIndex].push(cityWindowDummy.matrix.clone());
  }

  function addFramedCityWindow(x, y, z, width, height, face, materialIndex) {
    const frame = 0.065;
    const sill = 0.085;
    let px = x, pz = z, pw = width, pd = 0.045;

    if (face === "front" || face === "back") {
      const direction = face === "front" ? 1 : -1;
      pz += direction * 0.035;

      addCityDetail(x, y + height / 2 + frame / 2, pz,
        width + frame * 2, frame, 0.075, 0);
      addCityDetail(x, y - height / 2 - sill / 2, pz,
        width + frame * 2.5, sill, 0.13, 0);
      addCityDetail(x - width / 2 - frame / 2, y, pz,
        frame, height, 0.075, 0);
      addCityDetail(x + width / 2 + frame / 2, y, pz,
        frame, height, 0.075, 0);
    } else {
      const direction = face === "right" ? 1 : -1;
      px += direction * 0.035;
      pw = 0.045;
      pd = width;

      addCityDetail(px, y + height / 2 + frame / 2, z,
        0.075, frame, width + frame * 2, 0);
      addCityDetail(px, y - height / 2 - sill / 2, z,
        0.13, sill, width + frame * 2.5, 0);
      addCityDetail(px, y, z - width / 2 - frame / 2,
        0.075, height, frame, 0);
      addCityDetail(px, y, z + width / 2 + frame / 2,
        0.075, height, frame, 0);
    }

    addCityWindow(px, y, pz, pw, height, pd, materialIndex);
  }

  function addStorefront(x, z, w, d, baseY, kind) {
    const frontZ = z + d / 2 + 0.09;
    const groundHeight = Math.min(3.0, Math.max(2.35, w * 0.23));
    const doorWidth = Math.min(1.15, w * 0.17);
    const bays = Math.max(2, Math.min(5, Math.floor(w / 2.1)));
    const bayWidth = (w - 0.5) / bays;

    for (let i = 0; i < bays; i++) {
      const px = x - w / 2 + 0.25 + bayWidth * (i + 0.5);
      const panelWidth = Math.max(0.3, bayWidth - 0.12);

      addCityDetail(px, baseY + groundHeight * 0.52, frontZ,
        panelWidth, groundHeight * 0.76, 0.055, 6);

      addCityDetail(px - panelWidth / 2, baseY + groundHeight * 0.52,
        frontZ + 0.04, 0.045, groundHeight * 0.82, 0.075, 4);
      addCityDetail(px + panelWidth / 2, baseY + groundHeight * 0.52,
        frontZ + 0.04, 0.045, groundHeight * 0.82, 0.075, 4);
    }

    // Dark entrance, shop sign band and optional awning.
    addCityDetail(x, baseY + groundHeight * 0.52, frontZ + 0.055,
      doorWidth, groundHeight * 0.78, 0.08, 1);
    addCityDetail(x, baseY + groundHeight + 0.12, frontZ + 0.08,
      w * 0.88, 0.23, 0.15, kind === "retail" ? 5 : 0);

    if (kind === "retail") {
      addCityDetail(x, baseY + groundHeight + 0.43, frontZ + 0.18,
        w * 0.76, 0.10, 0.32, 5);
    }
  }

  function addBalcony(x, z, w, d, y, width) {
    const faceZ = z + d / 2 + 0.72;

    addCityDetail(x, y - 0.08, faceZ, width, 0.15, 1.25, 2);
    addCityDetail(x, y + 0.35, faceZ, width, 0.055, 0.055, 4);
    addCityDetail(x - width / 2, y + 0.16, faceZ,
      0.055, 0.38, 0.055, 4);
    addCityDetail(x + width / 2, y + 0.16, faceZ,
      0.055, 0.38, 0.055, 4);
    addCityDetail(x, y + 0.16, faceZ,
      Math.max(0.1, width - 0.12), 0.26, 0.035, 7);

    for (let i = 1; i < 4; i++) {
      addCityDetail(x - width / 2 + width * i / 4, y + 0.16, faceZ,
        0.035, 0.35, 0.045, 4);
    }
  }

  function addBuilding(x, z, w, d, h, color, gx = 0, gz = 0) {
    const baseY = hill(x, z);
    const facade = facadeMaterials.get(color) || mat(color, 0.82, 0.01);
    const downtown = Math.abs(gx) < 3 && Math.abs(gz) < 4;
    const tower = downtown && h >= 48;
    const roll = rand();

    let kind;
    if (tower) kind = "tower";
    else if (h >= 27) kind = roll < 0.55 ? "office" : "apartment";
    else if (roll < 0.34) kind = "retail";
    else if (roll < 0.70) kind = "residential";
    else kind = "apartment";

    const floorHeight = kind === "tower" ? 3.7 :
      kind === "office" ? 3.45 : kind === "retail" ? 3.35 : 3.05;
    const groundHeight = kind === "tower" ? 5.6 :
      kind === "retail" ? 3.25 : 2.8;
    const podiumHeight = tower ? Math.min(7, h * 0.16) : 0;

    if (tower) {
      box(w + 2, podiumHeight, d + 2, facade,
        x, baseY + podiumHeight / 2, z);
      box(w, h - podiumHeight, d, facade,
        x, baseY + podiumHeight + (h - podiumHeight) / 2, z);
    } else {
      box(w, h, d, facade, x, baseY + h / 2, z);
    }

    const frontZ = z + d / 2 + 0.06;
    const backZ = z - d / 2 - 0.06;
    const leftX = x - w / 2 - 0.06;
    const rightX = x + w / 2 + 0.06;

    // Architectural corner pilasters.
    const corner = kind === "tower" ? 0.23 : 0.17;
    const pilasterMaterial = kind === "residential" ? 3 : 0;

    for (const cx of [x - w / 2 + corner / 2, x + w / 2 - corner / 2]) {
      addCityDetail(cx, baseY + h / 2, frontZ, corner, h, 0.11, pilasterMaterial);
      addCityDetail(cx, baseY + h / 2, backZ, corner, h, 0.11, pilasterMaterial);
    }

    for (const cz of [z - d / 2 + corner / 2, z + d / 2 - corner / 2]) {
      addCityDetail(leftX, baseY + h / 2, cz, 0.11, h, corner, pilasterMaterial);
      addCityDetail(rightX, baseY + h / 2, cz, 0.11, h, corner, pilasterMaterial);
    }

    if (kind !== "tower" && kind !== "office") {
      addCityDetail(x, baseY + 0.24, frontZ, w * 0.97, 0.48, 0.15, 2);
      addCityDetail(x, baseY + 0.24, backZ, w * 0.97, 0.48, 0.15, 2);
    }

    if (["retail", "residential", "tower", "office"].includes(kind)) {
      addStorefront(x, z, tower ? w + 2 : w, tower ? d + 2 : d,
        baseY, kind === "retail" ? "retail" : "building");
    }

    const windowStart = baseY + podiumHeight + groundHeight;
    const available = Math.max(0, baseY + h - windowStart - 0.65);
    const floors = Math.min(kind === "tower" ? 24 : 10,
      Math.max(1, Math.floor(available / floorHeight)));
    const columns = Math.min(kind === "tower" ? 8 : 6,
      Math.max(2, Math.floor(w / (kind === "tower" ? 2.0 : 1.8))));
    const sideColumns = Math.min(6, Math.max(2, Math.floor(d / 1.9)));
    const windowHeight = Math.min(kind === "tower" ? 1.85 : 1.5,
      floorHeight * 0.57);

    for (let f = 0; f < floors; f++) {
      const wy = windowStart + f * floorHeight + floorHeight * 0.53;
      if (wy + windowHeight / 2 > baseY + h - 0.45) continue;

      if (["apartment", "office", "tower"].includes(kind)) {
        const band = kind === "tower" ? 2 : 0;
        const bandY = wy - floorHeight * 0.43;
        addCityDetail(x, bandY, frontZ, w, 0.07, 0.13, band);
        addCityDetail(x, bandY, backZ, w, 0.07, 0.13, band);
        addCityDetail(leftX, bandY, z, 0.13, 0.07, d, band);
        addCityDetail(rightX, bandY, z, 0.13, 0.07, d, band);
      }

      for (let c = 0; c < columns; c++) {
        const wx = x - w / 2 + (c + 0.5) * w / columns;
        const ww = Math.min(kind === "tower" ? 1.18 : 1.05,
          w / columns * 0.55);
        const frontMat = Math.floor(rand() * windowMats.length);
        const backMat = Math.floor(rand() * windowMats.length);

        addFramedCityWindow(wx, wy, z + d / 2, ww, windowHeight, "front", frontMat);
        addFramedCityWindow(wx, wy, z - d / 2, ww, windowHeight, "back", backMat);

        if ((kind === "apartment" || kind === "residential") &&
            f > 0 && f % 2 === 0 && rand() < 0.30 && ww > 0.72) {
          addBalcony(wx, z, w, d, wy - 0.1,
            Math.min(ww + 0.6, w / columns * 0.8));
        }
      }

      for (let c = 0; c < sideColumns; c++) {
        const wz = z - d / 2 + (c + 0.5) * d / sideColumns;
        const ww = Math.min(1.0, d / sideColumns * 0.55);

        addFramedCityWindow(x + w / 2, wy, wz, ww, windowHeight,
          "right", Math.floor(rand() * windowMats.length));
        addFramedCityWindow(x - w / 2, wy, wz, ww, windowHeight,
          "left", Math.floor(rand() * windowMats.length));
      }
    }

    // Finished roof silhouette with parapets and coping.
    const roofY = baseY + h;
    const parapetHeight = kind === "tower" ? 0.8 : 0.42;
    const parapetThickness = kind === "tower" ? 0.22 : 0.16;

    addCityDetail(x, roofY - parapetHeight / 2, frontZ,
      w + 0.15, parapetHeight, parapetThickness, 1);
    addCityDetail(x, roofY - parapetHeight / 2, backZ,
      w + 0.15, parapetHeight, parapetThickness, 1);
    addCityDetail(leftX, roofY - parapetHeight / 2, z,
      parapetThickness, parapetHeight, d + 0.15, 1);
    addCityDetail(rightX, roofY - parapetHeight / 2, z,
      parapetThickness, parapetHeight, d + 0.15, 1);

    addCityDetail(x, roofY + 0.035, frontZ, w + 0.28, 0.09, 0.24, 2);
    addCityDetail(x, roofY + 0.035, backZ, w + 0.28, 0.09, 0.24, 2);

    if (h > 16) {
      const rw = Math.min(w * 0.46, 5.2);
      const rd = Math.min(d * 0.44, 4.8);
      const rh = kind === "tower" ? 2.8 : 1.65;

      box(rw, rh, rd, rooftopMaterial,
        x - w * 0.12, roofY + rh / 2, z - d * 0.08);

      for (let i = 0; i < 3; i++) {
        addCityDetail(x - rw * 0.28 + i * rw * 0.28,
          roofY + rh + 0.12, z + rd * 0.12,
          0.28, 0.24, rd * 0.52, 4);
      }
    }

    if (kind === "residential") {
      for (const yy of [baseY + 0.72, baseY + h - 0.85]) {
        addCityDetail(x, yy, frontZ, w * 0.96, 0.11, 0.16, 0);
        addCityDetail(x, yy, backZ, w * 0.96, 0.11, 0.16, 0);
      }
    }
  }

  // Denser downtown parcels and smaller buildings toward outer districts.
  for (let gx = -5; gx <= 5; gx++) {
    for (let gz = -6; gz <= 6; gz++) {
      const bx = gx * blockStep;
      const bz = gz * blockStep;

      // Preserve the original clear starting area.
      if (Math.abs(bx) < 17 && Math.abs(bz) < 24) continue;

      const downtown = Math.abs(gx) < 3 && Math.abs(gz) < 4;
      const count = downtown ? 2 : (rand() < 0.58 ? 2 : 1);

      for (let n = 0; n < count; n++) {
        const x = bx + (rand() - 0.5) * 16;
        const z = bz + (rand() - 0.5) * 16;
        let w = 7.5 + rand() * 7;
        let d = 7 + rand() * 7;
        let h = 9 + rand() * 22;

        if (downtown && rand() > 0.42) {
          h = 48 + rand() * 72;
          w = 10 + rand() * 7;
          d = 10 + rand() * 6;
        } else if (downtown && rand() > 0.40) {
          h = 24 + rand() * 22;
          w = 9 + rand() * 6;
          d = 9 + rand() * 5;
        } else if (Math.abs(gx) >= 4 || Math.abs(gz) >= 5) {
          h = 7.5 + rand() * 13;
          w = 7 + rand() * 6;
          d = 7 + rand() * 6;
        }

        const color = facadeColors[Math.floor(rand() * facadeColors.length)];
        addBuilding(x, z, w, d, h, color, gx, gz);
      }
    }
  }

  // GPU-batch all window panes.
  for (let i = 0; i < cityWindowInstances.length; i++) {
    const matrices = cityWindowInstances[i];
    if (!matrices.length) continue;

    const batch = new THREE.InstancedMesh(
      cityWindowGeometry, windowMats[i], matrices.length
    );
    for (let j = 0; j < matrices.length; j++) {
      batch.setMatrixAt(j, matrices[j]);
    }
    batch.instanceMatrix.needsUpdate = true;
    batch.castShadow = false;
    batch.receiveShadow = false;
    scene.add(batch);
  }

  // GPU-batch trim, frames, sills, parapets, signs and balcony details.
  for (let i = 0; i < cityDetailInstances.length; i++) {
    const matrices = cityDetailInstances[i];
    if (!matrices.length) continue;

    const batch = new THREE.InstancedMesh(
      cityDetailGeometry, cityDetailMaterials[i], matrices.length
    );
    for (let j = 0; j < matrices.length; j++) {
      batch.setMatrixAt(j, matrices[j]);
    }
    batch.instanceMatrix.needsUpdate = true;
    batch.castShadow = false;
    batch.receiveShadow = false;
    if (i === 7) batch.renderOrder = 2;
    scene.add(batch);
  }

  // STREETLIGHTS
  const lampMat=mat(0x303a43,0.55,0.35);
  const bulbMat=new THREE.MeshStandardMaterial({
    color:0xffdba0, emissive:0xffa84a, emissiveIntensity:2
  });

  for (let z=-260;z<=260;z+=38) {
    for (const x of [-9,9]) {
      cylinder(0.12,0.16,5,lampMat,x,2.5,z);
      box(1.4,0.12,0.12,lampMat,x+(x<0?0.6:-0.6),4.9,z,false);

      const bulb=new THREE.Mesh(
        new THREE.SphereGeometry(0.2,8,8),bulbMat
      );
      bulb.position.set(x+(x<0?1.2:-1.2),4.8,z);
      scene.add(bulb);
    }
  }

  // GOLDEN GATE BRIDGE landmark ahead in the distance.
  // This is a recognizable geometric landmark, not a surveyed replica.
  const bridgeZ=-285;
  const bridgeDeck=box(220,1.2,9,red,0,16,bridgeZ);
  const towerMat=mat(0xc44738,0.5,0.2);

  for (const x of [-75,75]) {
    box(5,60,5,towerMat,x,30,bridgeZ);
    box(5,60,5,towerMat,x,30,bridgeZ-6);
    box(14,3,14,towerMat,x,49,bridgeZ-3);

    // Main suspension cables.
    const curve=new THREE.CatmullRomCurve3([
      new THREE.Vector3(-110,24,bridgeZ),
      new THREE.Vector3(-75,58,bridgeZ),
      new THREE.Vector3(0,29,bridgeZ),
      new THREE.Vector3(75,58,bridgeZ),
      new THREE.Vector3(110,24,bridgeZ)
    ]);
    scene.add(new THREE.Mesh(
      new THREE.TubeGeometry(curve,100,0.45,6,false),red
    ));
  }

  // CHARACTER — detailed adult male, third-person explorer.
  const player = new THREE.Group();
  scene.add(player);

  const skin = mat(0xc89170, 0.78);
  const skinLight = mat(0xd4a17f, 0.76);
  const jacket = mat(0x344b50, 0.68);
  const shirt = mat(0xd5d0c4, 0.82);
  const pants = mat(0x29364b, 0.8);
  const shoes = mat(0x171d25, 0.62);
  const hair = mat(0x30231d, 0.92);
  const eyes = mat(0x211b18, 0.7);

  function bodyPart(geometry, material, x, y, z) {
    const mesh = new THREE.Mesh(geometry, material);
    mesh.position.set(x, y, z);
    mesh.castShadow = false;
    mesh.receiveShadow = false;
    player.add(mesh);
    return mesh;
  }

  function ellipsoid(material, x, y, z, sx, sy, sz) {
    const mesh = bodyPart(
      new THREE.SphereGeometry(1, 12, 10),
      material, x, y, z
    );
    mesh.scale.set(sx, sy, sz);
    return mesh;
  }

  // Broad upper body, defined chest, torso and waist.
  ellipsoid(jacket, 0, 1.53, 0, 0.46, 0.58, 0.29);
  ellipsoid(jacket, 0, 1.82, 0, 0.57, 0.30, 0.31);
  ellipsoid(jacket, 0, 1.28, 0, 0.37, 0.34, 0.245);
  ellipsoid(shirt, 0, 1.94, -0.015, 0.17, 0.20, 0.285);
  ellipsoid(pants, 0, 0.98, 0, 0.35, 0.29, 0.25);

  // Shoulder definition.
  ellipsoid(jacket, -0.48, 1.81, 0, 0.23, 0.23, 0.23);
  ellipsoid(jacket,  0.48, 1.81, 0, 0.23, 0.23, 0.23);

  // Neck and sculpted head with a more defined jaw.
  bodyPart(
    new THREE.CylinderGeometry(0.135, 0.15, 0.25, 12),
    skin, 0, 2.08, 0
  );

  ellipsoid(skin, 0, 2.34, 0, 0.275, 0.34, 0.25);
  ellipsoid(skinLight, 0, 2.20, -0.045, 0.225, 0.19, 0.225);

  // Hair, ears, nose and simple facial features.
  ellipsoid(hair, 0, 2.56, 0.025, 0.285, 0.15, 0.265);
  ellipsoid(hair, 0, 2.49, -0.205, 0.23, 0.085, 0.075);

  ellipsoid(skin, -0.275, 2.33, 0, 0.055, 0.085, 0.045);
  ellipsoid(skin,  0.275, 2.33, 0, 0.055, 0.085, 0.045);
  ellipsoid(skinLight, 0, 2.31, -0.265, 0.045, 0.065, 0.05);

  ellipsoid(eyes, -0.095, 2.375, -0.229, 0.032, 0.025, 0.018);
  ellipsoid(eyes,  0.095, 2.375, -0.229, 0.032, 0.025, 0.018);
  ellipsoid(hair, -0.095, 2.416, -0.225, 0.045, 0.012, 0.018);
  ellipsoid(hair,  0.095, 2.416, -0.225, 0.045, 0.012, 0.018);

  // Tapered limbs attached to animated pivots.
  function limb(x, y, length, material, topRadius, bottomRadius) {
    const pivot = new THREE.Group();
    pivot.position.set(x, y, 0);
    player.add(pivot);

    const mesh = new THREE.Mesh(
      new THREE.CylinderGeometry(
        topRadius, bottomRadius, length, 10
      ),
      material
    );
    mesh.position.y = -length / 2;
    mesh.castShadow = false;
    pivot.add(mesh);

    return pivot;
  }

  const leftArm = limb(-0.57, 1.82, 0.86, jacket, 0.17, 0.12);
  const rightArm = limb(0.57, 1.82, 0.86, jacket, 0.17, 0.12);
  const leftLeg = limb(-0.23, 0.96, 0.96, pants, 0.17, 0.12);
  const rightLeg = limb(0.23, 0.96, 0.96, pants, 0.17, 0.12);

  // Shoes sit at ground level, facing the direction of travel.
  bodyPart(
    new THREE.BoxGeometry(0.32, 0.15, 0.50),
    shoes, -0.23, 0.08, -0.10
  );
  bodyPart(
    new THREE.BoxGeometry(0.32, 0.15, 0.50),
    shoes, 0.23, 0.08, -0.10
  );

  // Player starts in the middle of the street.
  player.position.set(0, hill(0, 8) + 0.055, 8);

  // Third-person camera: always starts behind the character.
  camera.position.set(0, hill(0, 8) + 4.3, 15);
  camera.lookAt(0, hill(0, 8) + 1.3, 8);

  const keys=new Set();
  let heading=0;
  let walkTime=0;
  let lastTime=performance.now();

  function press(key) { keys.add(key); }
  function release(key) { keys.delete(key); }

  window.addEventListener("keydown",e=>{
    const k=e.key.toLowerCase();
    if(["w","a","s","d","arrowup","arrowdown","arrowleft","arrowright"].includes(k)){
      e.preventDefault();
      press(k);
    }
  });

  window.addEventListener("keyup",e=>release(e.key.toLowerCase()));
  window.addEventListener("blur",()=>keys.clear());

  function bindButton(id,key) {
    const el=document.getElementById(id);

    el.addEventListener("pointerdown",e=>{
      e.preventDefault();
      press(key);
      el.setPointerCapture?.(e.pointerId);
    });

    const end=e=>{e.preventDefault();release(key);};
    el.addEventListener("pointerup",end);
    el.addEventListener("pointercancel",end);
    el.addEventListener("lostpointercapture",()=>release(key));
  }

  bindButton("forward","w");
  bindButton("back","s");
  bindButton("left","a");
  bindButton("right","d");

  function animate(now) {
    requestAnimationFrame(animate);
    const dt=Math.min((now-lastTime)/1000,0.04);
    lastTime=now;

    const turning=1.9*dt;
    if(keys.has("a")||keys.has("arrowleft")) heading+=turning;
    if(keys.has("d")||keys.has("arrowright")) heading-=turning;

    let moving=0;
    if(keys.has("w")||keys.has("arrowup")) moving+=1;
    if(keys.has("s")||keys.has("arrowdown")) moving-=1;

    if(moving!==0) {
      const speed=9*dt*moving;
      player.position.x+=Math.sin(heading)*speed;
      player.position.z-=Math.cos(heading)*speed;
      player.position.y=hill(player.position.x, player.position.z) + 0.055;

      walkTime+=dt*11;
      leftArm.rotation.x=Math.sin(walkTime)*0.65;
      rightArm.rotation.x=-Math.sin(walkTime)*0.65;
      leftLeg.rotation.x=-Math.sin(walkTime)*0.65;
      rightLeg.rotation.x=Math.sin(walkTime)*0.65;
    } else {
      leftArm.rotation.x=THREE.MathUtils.damp(leftArm.rotation.x,0,8,dt);
      rightArm.rotation.x=THREE.MathUtils.damp(rightArm.rotation.x,0,8,dt);
      leftLeg.rotation.x=THREE.MathUtils.damp(leftLeg.rotation.x,0,8,dt);
      rightLeg.rotation.x=THREE.MathUtils.damp(rightLeg.rotation.x,0,8,dt);
    }

    player.rotation.y=heading;

    // Smooth follow camera, positioned behind and above the player.
    const distance=9;
    const targetCamera=new THREE.Vector3(
      player.position.x-Math.sin(heading)*distance,
      player.position.y+4.2,
      player.position.z+Math.cos(heading)*distance
    );

    camera.position.lerp(targetCamera,1-Math.exp(-5*dt));
    camera.lookAt(
      player.position.x,
      player.position.y+1.35,
      player.position.z
    );

    // Gentle sunlit ambience without a space backdrop.
    for (const asset of activeAssets) asset.update(dt);
    renderer.render(scene,camera);

    if(now>2500) intro.style.opacity="0.2";
  }

  window.addEventListener("resize",()=>{
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.25));
  });

  window.ourSearchWorld = {
    async loadModel(url, options = {}) {
      const asset = await assetLoader.load(url, options);
      scene.add(asset.model);
      activeAssets.add(asset);
      return asset;
    },
    removeModel(asset) {
      if (!activeAssets.delete(asset)) return;
      scene.remove(asset.model);
      asset.dispose();
    },
    async spawnCar() {
      const car = await this.loadModel(
        "./assets/plymouth-hemi-cuda-1971.glb",
        { position: [4.5, 0, 8] }
      );

      const bounds = new THREE.Box3().setFromObject(car.model);
      const size = new THREE.Vector3();
      bounds.getSize(size);
      const horizontalSize = Math.max(size.x, size.z);

      if (!Number.isFinite(horizontalSize) || horizontalSize <= 0) {
        this.removeModel(car);
        throw new Error("Car model has no measurable dimensions.");
      }

      car.model.scale.setScalar(4.6 / horizontalSize);
      car.model.updateMatrixWorld(true);

      const groundBounds = new THREE.Box3().setFromObject(car.model);
      car.model.position.y +=
        hill(car.model.position.x, car.model.position.z) - groundBounds.min.y;

      return car;
    }
  };

  window.ourSearchWorld.spawnCar().then(() => {
    console.info("Plymouth Hemi Cuda loaded into OUR SEARCH world.");
  }).catch((err) => {
    console.error("Could not load the Plymouth car model:", err);
    status.textContent = "CAR LOAD FAILED — CHECK CONNECTION";
  });

  status.textContent="SAN FRANCISCO · CITY WORLD";
  requestAnimationFrame(animate);

} catch (err) {
  console.error(err);
  errorBox.style.display="block";
  errorBox.textContent="3D scene failed: "+err.message;
  document.getElementById("status").textContent="SCENE ERROR";
}
</script>
</body>
</html>
