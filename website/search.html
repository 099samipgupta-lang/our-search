<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Search — Our Search</title>

    <link
        rel="stylesheet"
        href="/style.css"
    >

</head>

<body class="search-page">

    <header class="search-header">

        <a
            href="/"
            class="search-logo"
            aria-label="Our Search home"
        >
            Our Search
        </a>

        <form
            class="search-page-form"
            method="GET"
            action="/search"
        >

            <span
                class="search-page-icon"
                aria-hidden="true"
            >⌕</span>

            <input
                id="search-input"
                type="search"
                name="q"
                placeholder="Search anything..."
                autocomplete="off"
                enterkeyhint="search"
            >

            <button
                type="submit"
                aria-label="Search"
            >
                →
            </button>

        </form>

    </header>


    <main class="search-main">

        <div class="search-intro">

            <h1>What do you want to explore?</h1>

            <p>
                Search the world's information with Our Search.
            </p>

        </div>

    </main>

</body>
</html>
